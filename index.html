<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON GEN — Futuristic Randomizer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-glow"></div>
    
    <div class="main-container">
        <header>
            <h1 class="glitch" data-text="NEON GEN">NEON GEN</h1>
            <p class="subtitle">Advanced Randomization System</p>
        </header>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="switchMode('number')">ЧИСЛА</button>
            <button class="mode-btn" onclick="switchMode('list')">СПИСОК</button>
        </div>

        <div id="number-section" class="input-section">
            <div class="input-grid">
                <div class="input-box">
                    <label>MIN</label>
                    <input type="number" id="min-val" value="1">
                </div>
                <div class="input-box">
                    <label>MAX</label>
                    <input type="number" id="max-val" value="100">
                </div>
            </div>
        </div>

        <div id="list-section" class="input-section" style="display: none;">
            <div class="input-box">
                <label>Введите варианты (через запятую или с новой строки)</label>
                <textarea id="list-items" placeholder="Напр: Артем, Иван, Мария..."></textarea>
            </div>
        </div>

        <button id="generate-btn" onclick="processRandom()">СГЕНЕРИРОВАТЬ</button>

        <div class="result-display">
            <div id="result-label">ОЖИДАНИЕ СИСТЕМЫ...</div>
            <div id="result-value">---</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
